services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: babybloom_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - mysql

  nginx:
    image: nginx:1.27-alpine
    container_name: babybloom_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  vite:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: babybloom_vite
    working_dir: /var/www
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./:/var/www
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: babybloom_mysql
    environment:
      MYSQL_DATABASE: babybloom
      MYSQL_USER: babybloom
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
